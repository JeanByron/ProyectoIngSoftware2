services:
  mysql-identidad:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identidad
    volumes:
      - mysql-identidad:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20
    networks: [agroinsumos-net]

  mysql-inventario:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario
    volumes:
      - mysql-inventario:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20
    networks: [agroinsumos-net]

  mysql-compras:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: compras
    volumes:
      - mysql-compras:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20
    networks: [agroinsumos-net]

  mysql-gateway:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gateway
    volumes:
      - mysql-gateway:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20
    networks: [agroinsumos-net]

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks: [agroinsumos-net]

  identidad:
    build: ./services/identidad
    restart: on-failure
    # ports
    environment:
      DB_HOST: mysql-identidad
      DB_PORT: "3306"
      DB_NAME: identidad
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql-identidad:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agroinsumos-net]

  catalogo:
    build: ./services/catalogo
    restart: on-failure
    # ports
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: catalogo
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agroinsumos-net]

  inventario:
    build: ./services/inventario
    restart: on-failure
    #
    environment:
      DB_HOST: mysql-inventario
      DB_PORT: "3306"
      DB_NAME: inventario
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      mysql-inventario:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agroinsumos-net]

  compras:
    build: ./services/compras
    restart: on-failure
    # ports
    environment:
      DB_HOST: mysql-compras
      DB_PORT: "3306"
      DB_NAME: compras
      DB_USER: root
      DB_PASSWORD: root
      CATALOGO_URL: http://catalogo:8002/api/v1
      INVENTARIO_URL: http://inventario:8003/api/v1
    depends_on:
      mysql-compras:
        condition: service_healthy
      catalogo:
        condition: service_started
      inventario:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agroinsumos-net]

  reportes:
    build: ./services/reportes
    restart: on-failure
    # ports
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: reportes
      INVENTARIO_URL: http://inventario:8003/api/v1
    depends_on:
      - mongo
      - inventario
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [agroinsumos-net]
  
  gateway:
    build: ./services/gateway
    restart: on-failure
    ports:
      - "8000:80"                     # el ÚNICO puerto expuesto hacia afuera
    environment:
      APP_KEY: ${GATEWAY_APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: mysql
      DB_HOST: mysql-gateway
      DB_PORT: "3306"
      DB_DATABASE: gateway
      DB_USERNAME: root
      DB_PASSWORD: root
      IDENTIDAD_URL: http://identidad:8001/api/v1
      CATALOGO_URL: http://catalogo:8002/api/v1
      INVENTARIO_URL: http://inventario:8003/api/v1
      COMPRAS_URL: http://compras:8004/api/v1
      REPORTES_URL: http://reportes:8005/api/v1
    depends_on:
      mysql-gateway:
        condition: service_healthy
      identidad:
        condition: service_started
      catalogo:
        condition: service_started
      inventario:
        condition: service_started
      compras:
        condition: service_started
      reportes:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [agroinsumos-net]



volumes:
  mysql-identidad:
  mysql-inventario:
  mysql-compras:
  mongo-data:
  mysql-gateway:

networks:
  agroinsumos-net:
    driver: bridge
